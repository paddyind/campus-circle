# Validate + build Android APK and iOS app. Use this before releasing any version.
# Trigger: manual only (Actions → "Validate and build mobile" → Run workflow). On push to main, the main CI workflow runs instead (one run per push).
# Artifacts: APK (install on device or BrowserStack/LambdaTest), iOS .app (simulator) or IPA if signing is configured.
# Install: uses "npm ci || npm install" so CI passes when package-lock.json is out of sync; run "npm install" in frontend/ and commit the lock file to restore strict npm ci.

name: Validate and build mobile

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API URL (e.g. http://YOUR_LAN_IP:8000/api for same-WiFi). Leave blank to use repo variable.'
        required: false
        default: ''
        type: string

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set repo root (works for GITHUB_WORKSPACE or .../repo/repo nesting)
        run: |
          cd "$GITHUB_WORKSPACE"
          found="$(find . -path '*/infra/docker-compose.yml' -print -quit 2>/dev/null)"
          [ -n "$found" ] || { echo "ERROR: infra/docker-compose.yml not found"; exit 1; }
          REPO_ROOT="$(cd "$(dirname "$(dirname "$found")")" && pwd)"
          echo "REPO_ROOT=$REPO_ROOT" >> $GITHUB_ENV
          echo "Using REPO_ROOT=$REPO_ROOT"

      - name: Create minimal .env
        run: |
          cd "$REPO_ROOT"
          cp .env.example .env 2>/dev/null || true
          for key in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_HOST SUPABASE_DB_PORT SUPABASE_DB_NAME SUPABASE_DB_USER SUPABASE_DB_PASSWORD; do
            grep -q "^${key}=" .env 2>/dev/null || echo "${key}=placeholder" >> .env
          done

      - name: Sanity tests
        run: |
          cd "$REPO_ROOT"
          chmod +x infra/scripts/sanity-test.sh
          ./infra/scripts/sanity-test.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and test
        run: |
          cd "$REPO_ROOT/frontend"
          npm install
          npm test -- --watchAll=false

      - name: Docker Compose config
        run: |
          cd "$REPO_ROOT"
          : > .env
          for key in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_HOST SUPABASE_DB_PORT SUPABASE_DB_NAME SUPABASE_DB_USER SUPABASE_DB_PASSWORD; do
            echo "${key}=placeholder" >> .env
          done
          docker compose -f "$REPO_ROOT/infra/docker-compose.yml" --project-directory "$REPO_ROOT" --env-file "$REPO_ROOT/.env" config

  build-android:
    name: Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set repo root
        run: |
          cd "$GITHUB_WORKSPACE"
          found="$(find . -path '*/infra/docker-compose.yml' -print -quit 2>/dev/null)"
          [ -n "$found" ] || { echo "ERROR: infra/docker-compose.yml not found"; exit 1; }
          REPO_ROOT="$(cd "$(dirname "$(dirname "$found")")" && pwd)"
          echo "REPO_ROOT=$REPO_ROOT" >> $GITHUB_ENV
          echo "Using REPO_ROOT=$REPO_ROOT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd "$REPO_ROOT/frontend" && npm install

      - name: Build web and sync Capacitor
        run: |
          cd "$REPO_ROOT/frontend"
          REACT_APP_API_URL="${REACT_APP_API_URL:-https://your-api.com/api}" npm run cap:sync
        env:
          REACT_APP_API_URL: ${{ github.event.inputs.api_url || vars.REACT_APP_API_URL || 'https://your-api.com/api' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Verify Android manifest allows HTTP (cleartext) for device
        run: |
          cd "$REPO_ROOT/frontend/android"
          grep -q 'usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml || { echo "ERROR: AndroidManifest.xml must contain usesCleartextTraffic=\"true\" so the app can reach http://YOUR_IP:8000/api on device"; exit 1; }
          echo "Manifest allows cleartext - APK will be able to use HTTP API on device"

      - name: Build debug APK
        run: |
          cd "$REPO_ROOT/frontend/android"
          ./gradlew assembleDebug --no-daemon

      - name: Verify built APK allows cleartext (HTTP)
        run: |
          cd "$REPO_ROOT/frontend/android"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] || { echo "APK not found"; exit 1; }
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          [ -x "$AAPT" ] || AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -1)"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "usesCleartextTraffic" || { echo "Built APK manifest missing usesCleartextTraffic - HTTP API will fail on device"; exit 1; }
          echo "APK verified: manifest allows cleartext traffic"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.REPO_ROOT }}/frontend/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: iOS (Simulator .app)
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set repo root
        run: |
          cd "$GITHUB_WORKSPACE"
          found="$(find . -path '*/infra/docker-compose.yml' -print -quit 2>/dev/null)"
          [ -n "$found" ] || { echo "ERROR: infra/docker-compose.yml not found"; exit 1; }
          REPO_ROOT="$(cd "$(dirname "$(dirname "$found")")" && pwd)"
          echo "REPO_ROOT=$REPO_ROOT" >> $GITHUB_ENV
          echo "Using REPO_ROOT=$REPO_ROOT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd "$REPO_ROOT/frontend" && npm install

      - name: Build web and sync Capacitor
        run: |
          cd "$REPO_ROOT/frontend"
          REACT_APP_API_URL="${REACT_APP_API_URL:-https://your-api.com/api}" npm run cap:sync
        env:
          REACT_APP_API_URL: ${{ github.event.inputs.api_url || vars.REACT_APP_API_URL || 'https://your-api.com/api' }}

      - name: Build for iOS Simulator
        run: |
          cd "$REPO_ROOT/frontend/ios/App"
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -configuration Debug \
            build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-simulator
          path: ${{ env.REPO_ROOT }}/frontend/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
