#version: '3.8'

name: campus-circle

services:
  # Prod: serves frontend/build and proxies /api to backend (container named frontend for clarity)
  nginx:
    container_name: campus-circle-frontend
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - backend
    profiles:
      - nginx

  # Dev: React dev server (port 3000)
  frontend:
    container_name: campus-circle-frontend-dev
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    profiles:
      - dev

  backend:
    container_name: campus-circle-backend
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports:
      - "8000:8000"
    # .env path is relative to --project-directory (repo root); always run compose with --project-directory set to repo root
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ../backend:/app

  # Migrations run against SUPABASE_DB_HOST (Supabase or local db). No dependency on local db.
  migrations:
    container_name: campus-circle-migrations
    image: postgres:15-alpine
    environment:
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST}
      - SUPABASE_DB_PORT=${SUPABASE_DB_PORT}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
    command: >
      sh -c "
        echo 'Waiting for database at $$SUPABASE_DB_HOST...' &&
        while ! pg_isready -h $$SUPABASE_DB_HOST -p $$SUPABASE_DB_PORT -U $$SUPABASE_DB_USER 2>/dev/null; do
          sleep 2;
        done;
        echo 'Database is ready!';
        for f in /migrations/*.sql; do PGPASSWORD=$$SUPABASE_DB_PASSWORD psql -v ON_ERROR_STOP=1 -h $$SUPABASE_DB_HOST -p $$SUPABASE_DB_PORT -U $$SUPABASE_DB_USER -d $$SUPABASE_DB_NAME -f $$f; done
      "
    volumes:
      - ../database:/migrations
    profiles:
      - migrations

  # Local Postgres only when you want a DB on your machine. Omit this profile for Supabase-only.
  db:
    container_name: campus-circle-db
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${SUPABASE_DB_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=${SUPABASE_DB_NAME:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - local-db

volumes:
  db_data:
